name: Password manager plugins

on:
  pull_request:
    paths: ["plugins/1password/**", "plugins/bitwarden/**", "plugins/protonpass/**", ".github/workflows/credential-plugins.yml"]
  push:
    branches: [main]
    paths: ["plugins/1password/**", "plugins/bitwarden/**", "plugins/protonpass/**", ".github/workflows/credential-plugins.yml"]

permissions:
  contents: read

concurrency:
  group: credential-plugins-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin:
    name: ${{ matrix.plugin }} on ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        plugin: [1password, bitwarden, protonpass]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: hashFiles(format('plugins/{0}/main/package.json', matrix.plugin)) != ''
        with:
          node-version: 24.22.2
      - name: Install, type check, build and test plugins/${{ matrix.plugin }}/main
        if: hashFiles(format('plugins/{0}/main/package.json', matrix.plugin)) != ''
        working-directory: plugins/${{ matrix.plugin }}/main
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          npm test
      - name: Pack the plugin folder
        if: hashFiles(format('plugins/{0}/build.sh', matrix.plugin)) != ''
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          set -eu
          "plugins/$PLUGIN/build.sh" "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/out"
          sha256sum -c "$PLUGIN"-plugin-*.tar.gz.sha256
          tar -tzf "$PLUGIN"-plugin-*.tar.gz | sort > files.txt
          grep -qx "$PLUGIN/plugin.json" files.txt
          grep -qx "$PLUGIN/dist/main.js" files.txt
          echo "$PLUGIN: $(wc -c < "$PLUGIN/dist/main.js") bytes of main.js" >> "$GITHUB_STEP_SUMMARY"
